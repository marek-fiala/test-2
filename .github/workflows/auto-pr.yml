name: Auto Create Pull Requests

on:
  push:
    branches: [dev1, staging]
  schedule:
    # Run daily at 9 AM UTC to check for differences
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  auto-pr-dev1-to-staging:
    if: github.ref == 'refs/heads/dev1' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check if staging branch exists
        id: check-staging
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/staging; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ERROR: staging branch does not exist!"
            exit 1
          fi

      - name: Check for differences between dev1 and staging
        id: check-diff
        run: |
          git fetch origin staging
          if git diff --quiet origin/dev1 origin/staging; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Check if PR already exists
        id: check-pr
        if: steps.check-diff.outputs.has-changes == 'true'
        run: |
          PR_COUNT=$(gh pr list --head dev1 --base staging --state open --json number --jq length)
          echo "exists=$([ $PR_COUNT -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request dev1 → staging
        if: steps.check-diff.outputs.has-changes == 'true' && steps.check-pr.outputs.exists == 'false'
        run: |
          COMMITS=$(git log origin/staging..origin/dev1 --oneline --no-merges | head -10)
          FILES_CHANGED=$(git diff --name-only origin/staging origin/dev1 | head -20)

          cat > pr_body.md << 'EOF'
          ## 🚀 Development to Staging Sync

          **Auto-generated PR**: Syncing latest development changes to staging environment.

          ### 🔍 Recent Commits
          ```
          EOF
          echo "$COMMITS" >> pr_body.md
          cat >> pr_body.md << 'EOF'
          ```

          ### 📁 Files Modified
          EOF
          echo "$FILES_CHANGED" | sed 's/^/- `/' | sed 's/$/`/' >> pr_body.md
          cat >> pr_body.md << 'EOF'

          ### ✅ Merge Instructions
          - **Use "Create a merge commit" when merging**
          - Ensure all CI checks pass before merging
          - Review changes for staging compatibility

          ---
          *🤖 This PR was created automatically by GitHub Actions*
          EOF

          gh pr create \
            --title "🚀 Sync: dev1 → staging" \
            --body-file pr_body.md \
            --head dev1 \
            --base staging \
            --label "auto-generated,staging-sync" \
            --assignee "${{ github.actor }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auto-pr-staging-to-main:
    if: github.ref == 'refs/heads/staging' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check if main branch exists
        id: check-main
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ERROR: main branch does not exist!"
            exit 1
          fi

      - name: Check for differences between staging and main
        id: check-diff
        run: |
          git fetch origin main
          if git diff --quiet origin/staging origin/main; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Check if PR already exists
        id: check-pr
        if: steps.check-diff.outputs.has-changes == 'true'
        run: |
          PR_COUNT=$(gh pr list --head staging --base main --state open --json number --jq length)
          echo "exists=$([ $PR_COUNT -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request staging → main
        if: steps.check-diff.outputs.has-changes == 'true' && steps.check-pr.outputs.exists == 'false'
        run: |
          COMMITS=$(git log origin/main..origin/staging --oneline --no-merges | head -15)
          FILES_CHANGED=$(git diff --name-only origin/main origin/staging | head -25)

          cat > pr_body.md << 'EOF'
          ## 🌟 Staging to Production Release

          **Auto-generated PR**: Promoting tested staging changes to production.

          ### 🔍 All Changes Since Last Release
          ```
          EOF
          echo "$COMMITS" >> pr_body.md
          cat >> pr_body.md << 'EOF'
          ```

          ### 📁 Files Modified
          EOF
          echo "$FILES_CHANGED" | sed 's/^/- `/' | sed 's/$/`/' >> pr_body.md
          cat >> pr_body.md << 'EOF'

          ### ⚠️ Pre-Merge Checklist
          - [ ] All CI/CD checks are passing
          - [ ] Staging environment testing completed
          - [ ] Breaking changes documented (if any)
          - [ ] Database migrations tested (if applicable)
          - [ ] All Jira issues are linked and moved to specific column in Jira
          - [ ] Performance impact assessed

          ### ✅ Merge Instructions
          - **IMPORTANT: Use "Create a merge commit" when merging**
          - Do NOT use squash or rebase merge

          ---
          *🤖 This PR was created automatically by GitHub Actions*
          EOF

          gh pr create \
            --title "🌟 Release: staging → main" \
            --body-file pr_body.md \
            --head staging \
            --base main \
            --label "auto-generated,release,production" \
            --assignee "${{ github.actor }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
